spring.profiles.active=@spring.profiles.active@
spring.application.name=payment-validation-service

server.port=${SERVER_PORT:8081}

#validator.rules=CHECK1_VALIDATOR_RULE,CHECK2_VALIDATOR_RULE

validator.rules=${VALIDATOR_RULES:CHECK1_VALIDATOR_RULE,CHECK2_VALIDATOR_RULE}
mytestkey=from application.properties

hmac.secret.key=${HMAC_SECRET_KEY:THIS_IS_MY_SECRETE_KEY}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always